<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/7594/7594072.png">
  
  <title>Ev Görevleri & Puan Tablosu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight">🏠 Ev Görevleri</h1>
      <select id="userSelect" onchange="changeUser(this.value)" class="bg-indigo-700 text-white font-medium text-sm py-1.5 px-3 rounded-lg border border-indigo-500 focus:outline-none">
        <option value="Yiğit">Profil: Yiğit</option>
        <option value="Buse">Profil: Buse</option>
      </select>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-6">

    <!-- Puan Durumu (KİŞİYE ÖZEL SIFIRLAMA) -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wide">🏆 Puan Durumu</h2>
        <button onclick="resetMyPoints()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 font-bold px-3 py-1.5 rounded-lg transition-colors shadow-sm border border-red-100" title="Sadece Kendi Puanımı Sıfırla">🔄 Sıfırla</button>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="text-center p-3 bg-slate-50 rounded-xl border border-slate-100">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Benim Puanım</span>
          <div id="myPoints" class="text-3xl font-extrabold text-indigo-600 mt-1">0</div>
        </div>
        <div class="text-center p-3 bg-slate-50 rounded-xl border border-slate-100">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Partner Puanı</span>
          <div id="partnerPoints" class="text-3xl font-extrabold text-pink-500 mt-1">0</div>
        </div>
      </div>
    </div>

    <!-- ÖDÜL MARKETİ (EKLE/ÇIKAR ÖZELLİKLİ) -->
    <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-4 rounded-xl shadow-sm border border-yellow-200">
      <h2 class="text-sm font-bold text-yellow-800 mb-3 uppercase tracking-wide">🎁 Ödül Marketi</h2>
      
      <!-- Ödül Ekleme Alanı -->
      <div class="flex gap-2 mb-4">
        <input type="text" id="newRewardTitle" placeholder="Ödül (Örn: Dondurma)" class="flex-1 border border-yellow-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 bg-white">
        <input type="number" id="newRewardCost" placeholder="Bedel" class="w-20 border border-yellow-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 bg-white">
        <button onclick="addReward()" class="bg-yellow-500 hover:bg-yellow-600 text-white text-sm font-semibold px-3 py-1.5 rounded-lg transition-colors">Ekle</button>
      </div>

      <div id="rewardsList" class="space-y-2">
        <p class="text-xs text-slate-400">Yükleniyor...</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">💡 Ödüllü İstek Gönder</h2>
      <div class="flex gap-2">
        <input type="text" id="requestInput" placeholder="Örn: Kahve yap..." class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="number" id="requestPoints" placeholder="Puan" class="w-20 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addRequest()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Gönder</button>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">📩 Gelen İstekler</h2>
      <div id="requestsList" class="space-y-2">
        <p class="text-xs text-slate-400">Yükleniyor...</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 bg-indigo-50">
      <h2 class="text-sm font-bold text-indigo-800 mb-2 uppercase tracking-wide">➕ Listeye Kalıcı Görev Ekle</h2>
      <div class="flex gap-2">
        <input type="text" id="newTaskTitle" placeholder="Görev Adı (Örn: Çöpü At)" class="flex-1 border border-indigo-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="number" id="newTaskPoints" placeholder="Puan" class="w-20 border border-indigo-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addTask()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Ekle</button>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">✅ Yapılacak Görevler</h2>
      <div id="tasksList" class="space-y-3">
        <p class="text-xs text-slate-400">Görevler yükleniyor...</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">⏱️ Son Yapılan İşler</h2>
      <div id="historyList" class="space-y-2">
        <p class="text-xs text-slate-400">Yükleniyor...</p>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://wbbztdstalznijwutydz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KoiM7IPTmTf7-kDucRq-GA_VFE-no9T';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = 'Yiğit';

    function changeUser(user) {
      currentUser = user;
      loadProfiles();
      fetchRequests();
    }

    async function loadProfiles() {
      const { data } = await db.from('profiles').select('*');
      if (data) {
        const me = data.find(p => p.name === currentUser);
        const partner = data.find(p => p.name !== currentUser);
        
        const myPts = me ? me.points || 0 : 0;
        const partnerPts = partner ? partner.points || 0 : 0;
        
        const myCrown = myPts > partnerPts && myPts > 0 ? ' 👑' : '';
        const partnerCrown = partnerPts > myPts && partnerPts > 0 ? ' 👑' : '';

        document.getElementById('myPoints').innerText = myPts + myCrown;
        document.getElementById('partnerPoints').innerText = partnerPts + partnerCrown;
      }
    }

    // YENİ: Sadece Kendi Puanını Sıfırla
    async function resetMyPoints() {
      if(!confirm(`Sadece kendi (${currentUser}) puanını sıfırlamak istediğine emin misin?`)) return;
      await db.from('profiles').update({ points: 0 }).eq('name', currentUser);
      loadProfiles();
    }

    // YENİ: Ödül Marketi Fonksiyonları
    async function loadRewards() {
      const { data } = await db.from('rewards').select('*').order('cost', { ascending: true });
      const container = document.getElementById('rewardsList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Markette şu an ödül yok.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-yellow-200 shadow-sm group">
          <div class="flex items-center gap-2">
            <button onclick="deleteReward('${r.id}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors" title="Ödülü Sil">🗑️</button>
            <span class="text-sm font-semibold text-slate-700">${r.title}</span>
          </div>
          <button onclick="buyReward(${r.cost}, '${r.title.replace(/'/g, "\\'")}')" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xs font-bold px-3 py-1.5 rounded-md transition-colors">-${r.cost} Puan</button>
        </div>
      `).join('');
    }

    async function addReward() {
      const titleInput = document.getElementById('newRewardTitle');
      const costInput = document.getElementById('newRewardCost');
      if (!titleInput.value.trim() || !costInput.value) return;

      const title = titleInput.value.trim();
      const cost = parseInt(costInput.value);

      const { error } = await db.from('rewards').insert([{ title, cost }]);
      if (error) alert('Ödül eklenemedi: ' + error.message);
      else { titleInput.value = ''; costInput.value = ''; loadRewards(); }
    }

    async function deleteReward(id) {
      if(!confirm('Bu ödülü marketten silmek istediğinize emin misiniz?')) return;
      await db.from('rewards').delete().eq('id', id);
      loadRewards();
    }

    async function buyReward(cost, rewardName) {
      const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
      if (!profile || (profile.points || 0) < cost) {
        alert('Bu ödülü almak için puanın yetersiz! 🧹');
        return;
      }

      if(!confirm(`'${rewardName}' ödülünü ${cost} puan harcayarak almak istediğine emin misin?`)) return;

      const newPoints = profile.points - cost;
      await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
      
      await db.from('task_history').insert([{ 
        task_title: `🎁 ÖDÜL KULLANILDI: ${rewardName}`, 
        points: -cost, 
        completed_by: currentUser 
      }]);
      
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
      loadProfiles();
      loadHistory();
    }

    async function addTask() {
      const titleInput = document.getElementById('newTaskTitle');
      const pointsInput = document.getElementById('newTaskPoints');
      if (!titleInput.value.trim() || !pointsInput.value) return;

      const title = titleInput.value.trim();
      const points = parseInt(pointsInput.value);

      const { error } = await db.from('tasks').insert([{ title, points }]);
      if (error) alert('Görev eklenemedi: ' + error.message);
      else { titleInput.value = ''; pointsInput.value = ''; loadTasks(); }
    }

    async function deleteTask(id) {
      if(!confirm('Bu görevi listeden silmek istediğinize emin misiniz?')) return;
      await db.from('tasks').delete().eq('id', id);
      loadTasks();
    }

    async function loadTasks() {
      const { data } = await db.from('tasks').select('*');
      const container = document.getElementById('tasksList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Görev bulunamadı.</p>';
        return;
      }
      container.innerHTML = data.map(t => `
        <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-lg group">
          <div class="flex items-center gap-2">
            <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors" title="Görevi Sil">🗑️</button>
            <div>
              <h3 class="font-semibold text-slate-800 text-sm">${t.title}</h3>
              <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md inline-block mt-1">+${t.points} Puan</span>
            </div>
          </div>
          <button onclick="completeTask('${t.id}', '${t.title.replace(/'/g, "\\'")}', ${t.points})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-xs px-3 py-1.5 rounded-lg transition-colors shadow-sm">Tamamladım ➔</button>
        </div>
      `).join('');
    }

    async function completeTask(taskId, taskTitle, points) {
      const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
      if (profile) {
        const newPoints = (profile.points || 0) + points;
        await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
        loadProfiles();
      }
      await db.from('task_history').insert([{ task_title: taskTitle, points: points, completed_by: currentUser }]);
      
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      loadHistory();
    }

    async function loadHistory() {
      const { data } = await db.from('task_history').select('*').order('completed_at', { ascending: false }).limit(10);
      const container = document.getElementById('historyList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Henüz tamamlanan bir iş yok.</p>';
        return;
      }
      container.innerHTML = data.map(h => {
        const dateObj = new Date(h.completed_at);
        const dateStr = dateObj.toLocaleDateString('tr-TR');
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        
        const pointClass = h.points < 0 ? "text-red-600 bg-red-50" : "text-emerald-600 bg-emerald-50";
        const pointSign = h.points > 0 ? "+" : "";

        return `
          <div class="flex items-center justify-between p-2.5 bg-white border border-slate-100 rounded-lg text-sm shadow-sm">
            <div>
              <span class="font-semibold text-slate-700 block">${h.task_title}</span>
              <span class="text-[11px] text-slate-400 block mt-0.5">${h.completed_by} • ${dateStr} ${timeStr}</span>
            </div>
            <span class="text-xs font-bold px-2 py-1 rounded-md ${pointClass}">${pointSign}${h.points}</span>
          </div>
        `;
      }).join('');
    }

    async function addRequest() {
      const input = document.getElementById('requestInput');
      const pointsInput = document.getElementById('requestPoints');
      if (!input || !input.value.trim() || !pointsInput.value) return;

      const text = input.value.trim();
      const points = parseInt(pointsInput.value);

      const { error } = await db
        .from('requests')
        .insert([{ title: text, points: points, created_by: currentUser, status: 'pending' }]);

      if (error) alert('İstek gönderilemedi: ' + error.message);
      else { input.value = ''; pointsInput.value = ''; fetchRequests(); }
    }

    async function fetchRequests() {
      const { data } = await db.from('requests').select('*').eq('status', 'pending');
      const container = document.getElementById('requestsList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Aktif istek bulunmuyor.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-100 text-sm">
          <div>
            <span class="font-medium text-slate-800">${r.title}</span>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[11px] text-slate-400">Gönderen: ${r.created_by}</span>
              <span class="text-[11px] font-bold text-pink-600 bg-pink-50 px-1.5 py-0.5 rounded">Ödül: +${r.points || 0}</span>
            </div>
          </div>
          <button onclick="completeRequest('${r.id}', '${r.title.replace(/'/g, "\\'")}', ${r.points || 0}, '${r.created_at}')" class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-md font-semibold hover:bg-emerald-200 transition-colors">Tamamla</button>
        </div>
      `).join('');
    }

    // YENİ: Gecikme Hesaplamalı Tamamlama
    async function completeRequest(id, title, points, createdAt) {
      await db.from('requests').update({ status: 'completed' }).eq('id', id);
      
      // Saat ve Dakika Gecikmesini Hesapla
      let delayText = "";
      if (createdAt && createdAt !== 'undefined') {
        const createdDate = new Date(createdAt);
        const now = new Date();
        const diffMs = now - createdDate;
        const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
        const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        
        if (diffHrs > 0) {
            delayText = ` (İstekten ${diffHrs} saat ${diffMins} dk sonra yapıldı)`;
        } else if (diffMins > 0) {
            delayText = ` (İstekten ${diffMins} dk sonra yapıldı)`;
        } else {
            delayText = ` (Anında yapıldı!)`;
        }
      }

      const historyTitle = `Özel İstek: ${title}${delayText}`;

      if (points > 0) {
        const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
        if (profile) {
          const newPoints = (profile.points || 0) + points;
          await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
          loadProfiles();
        }
      }
      
      await db.from('task_history').insert([{ task_title: historyTitle, points: points, completed_by: currentUser }]);
      
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      loadHistory();
      fetchRequests();
    }

    loadProfiles();
    loadRewards(); // Ödülleri çek
    fetchRequests();
    loadTasks();
    loadHistory();
  </script>
</body>
</html>
