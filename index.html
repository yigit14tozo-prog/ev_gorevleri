<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/7594/7594072.png">
  
  <title>EV SEVGİSİ & Puan Tablosu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    body { background-color: #f8fafc; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .glass-header { background: rgba(79, 70, 229, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .glass-bottom { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid rgba(0,0,0,0.05); }
    .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
    
    .tab-hidden { display: none; }
    .nav-btn.active { color: #4f46e5; font-weight: 800; transform: scale(1.05); }
    .nav-btn { transition: all 0.2s ease-in-out; color: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 font-sans pb-24 antialiased">

  <!-- Üst Başlık -->
  <div class="glass-header text-white p-4 sticky top-0 z-50 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-extrabold tracking-tight drop-shadow-sm">🏠 EV SEVGİSİ</h1>
      <select id="userSelect" onchange="changeUser(this.value)" class="bg-white/20 backdrop-blur-md text-white font-semibold text-sm py-1.5 px-3 rounded-xl border border-white/30 focus:outline-none">
        <option value="Yiğit" class="text-slate-800">Profil: Yiğit</option>
        <option value="Buse" class="text-slate-800">Profil: Buse</option>
      </select>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 mt-2">

    <!-- SEKME 1: ANA SAYFA (Puan, İstekler ve Görevler Bir Arada) -->
    <div id="tab-home" class="space-y-6">
      
      <!-- PUAN DURUMU -->
      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-sm font-extrabold text-slate-700 uppercase tracking-wider flex items-center gap-1">🏆 Puan Durumu</h2>
          <button onclick="resetMyPoints()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 font-bold px-3 py-1.5 rounded-xl transition-all active:scale-95" title="Sadece Kendi Puanımı Sıfırla">🔄 Sıfırla</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="text-center p-4 bg-slate-50 rounded-2xl border border-slate-100 shadow-inner">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Benim Puanım</span>
            <div id="myPoints" class="text-4xl font-black text-indigo-600 mt-1 drop-shadow-sm">0</div>
          </div>
          <div class="text-center p-4 bg-slate-50 rounded-2xl border border-slate-100 shadow-inner">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Partner Puanı</span>
            <div id="partnerPoints" class="text-4xl font-black text-pink-500 mt-1 drop-shadow-sm">0</div>
          </div>
        </div>
      </div>

      <!-- GELEN İSTEKLER (ANA SAYFAYA TAŞINDI) -->
      <div class="bg-white p-5 rounded-2xl card-shadow border border-indigo-100">
        <h2 class="text-sm font-extrabold text-indigo-800 mb-3 uppercase tracking-wider">📩 Bekleyen İstekler</h2>
        <div id="requestsList" class="space-y-2">
          <p class="text-xs text-slate-400">Yükleniyor...</p>
        </div>
      </div>

      <!-- İSTEK GÖNDER (ANA SAYFAYA TAŞINDI) -->
      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100">
        <h2 class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wider">💡 Yeni İstek Gönder</h2>
        <div class="flex gap-2">
          <input type="text" id="requestInput" placeholder="Örn: Kahve yap..." class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm bg-slate-50 focus:outline-none">
          <input type="number" id="requestPoints" placeholder="Puan" class="w-20 border border-slate-200 rounded-xl px-3 py-2 text-sm bg-slate-50 focus:outline-none">
          <button onclick="addRequest()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-xl active:scale-95">İste</button>
        </div>
      </div>

      <!-- KALICI GÖREVLER -->
      <div class="bg-gradient-to-r from-slate-50 to-indigo-50 p-5 rounded-2xl card-shadow border border-indigo-100">
        <h2 class="text-sm font-extrabold text-indigo-800 mb-3 uppercase tracking-wider">✅ Kalıcı Görevler</h2>
        <div class="flex gap-2 mb-4">
          <input type="text" id="newTaskTitle" placeholder="Yeni Görev (Örn: Çöpü At)" class="flex-1 border border-indigo-200 rounded-xl px-3 py-2 text-sm focus:outline-none bg-white/80">
          <input type="number" id="newTaskPoints" placeholder="Puan" class="w-20 border border-indigo-200 rounded-xl px-3 py-2 text-sm focus:outline-none bg-white/80">
          <button onclick="addTask()" class="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-xl active:scale-95 shadow-sm">Ekle</button>
        </div>
        <div id="tasksList" class="space-y-3">
          <p class="text-xs text-slate-400">Görevler yükleniyor...</p>
        </div>
      </div>
    </div>


    <!-- SEKME 2: MARKET (ÖDÜL VE CEZA) -->
    <div id="tab-market" class="space-y-6 tab-hidden">
      <!-- CEZA SİSTEMİ -->
      <div class="bg-gradient-to-r from-red-50 to-rose-50 p-5 rounded-2xl card-shadow border border-red-100">
        <h2 class="text-sm font-extrabold text-red-800 mb-3 uppercase tracking-wider flex items-center gap-1">🚨 Ceza Kes</h2>
        <div class="flex gap-2 mb-4">
          <input type="text" id="newPenaltyTitle" placeholder="Ceza (Örn: Çöpü unuttu)" class="flex-1 border border-red-200 rounded-xl px-3 py-2 text-sm bg-white/80">
          <input type="number" id="newPenaltyPoints" placeholder="Puan" class="w-20 border border-red-200 rounded-xl px-3 py-2 text-sm bg-white/80">
          <button onclick="addPenalty()" class="bg-red-500 text-white text-sm font-bold px-4 py-2 rounded-xl active:scale-95 shadow-sm">Ekle</button>
        </div>
        <div id="penaltiesList" class="space-y-2">
          <p class="text-xs text-slate-400">Yükleniyor...</p>
        </div>
      </div>

      <!-- ÖDÜL MARKETİ -->
      <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-5 rounded-2xl card-shadow border border-yellow-200">
        <h2 class="text-sm font-extrabold text-yellow-800 mb-3 uppercase tracking-wider flex items-center gap-1">🎁 Ödül Marketi</h2>
        <div class="flex gap-2 mb-4">
          <input type="text" id="newRewardTitle" placeholder="Ödül (Örn: Dondurma)" class="flex-1 border border-yellow-300 rounded-xl px-3 py-2 text-sm bg-white/80">
          <input type="number" id="newRewardCost" placeholder="Bedel" class="w-20 border border-yellow-300 rounded-xl px-3 py-2 text-sm bg-white/80">
          <button onclick="addReward()" class="bg-yellow-500 text-white text-sm font-bold px-4 py-2 rounded-xl active:scale-95 shadow-sm">Ekle</button>
        </div>
        <div id="rewardsList" class="space-y-2">
          <p class="text-xs text-slate-400">Yükleniyor...</p>
        </div>
      </div>
    </div>


    <!-- SEKME 3: GEÇMİŞ -->
    <div id="tab-history" class="space-y-6 tab-hidden">
      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 min-h-[50vh]">
        <h2 class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wider">⏱️ Son Yapılan İşler</h2>
        <div id="historyList" class="space-y-2">
          <p class="text-xs text-slate-400">Yükleniyor...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- ALT MENÜ (SADELEŞTİRİLDİ - 3 BUTON) -->
  <div class="fixed bottom-0 left-0 right-0 glass-bottom pb-safe z-50">
    <div class="max-w-md mx-auto flex justify-around items-center py-2">
      
      <button onclick="switchTab('home', this)" class="nav-btn active flex flex-col items-center justify-center w-full py-1">
        <span class="text-2xl mb-1">🏠</span>
        <span class="text-[10px] font-bold uppercase tracking-wider">Ana Ekran</span>
      </button>

      <button onclick="switchTab('market', this)" class="nav-btn flex flex-col items-center justify-center w-full py-1">
        <span class="text-2xl mb-1">🎁</span>
        <span class="text-[10px] font-bold uppercase tracking-wider">Market</span>
      </button>

      <button onclick="switchTab('history', this)" class="nav-btn flex flex-col items-center justify-center w-full py-1">
        <span class="text-2xl mb-1">⏱️</span>
        <span class="text-[10px] font-bold uppercase tracking-wider">Geçmiş</span>
      </button>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wbbztdstalznijwutydz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KoiM7IPTmTf7-kDucRq-GA_VFE-no9T';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = 'Yiğit';

    // --- SEKME (TAB) DEĞİŞTİRME ---
    function switchTab(tabName, btnElement) {
      document.getElementById('tab-home').classList.add('tab-hidden');
      document.getElementById('tab-market').classList.add('tab-hidden');
      document.getElementById('tab-history').classList.add('tab-hidden');
      
      document.getElementById('tab-' + tabName).classList.remove('tab-hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active', 'text-indigo-600'));
      if(btnElement) btnElement.classList.add('active', 'text-indigo-600');
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeUser(user) {
      currentUser = user;
      loadProfiles();
      fetchRequests();
    }

    async function loadProfiles() {
      const { data } = await db.from('profiles').select('*');
      if (data) {
        const me = data.find(p => p.name === currentUser);
        const partner = data.find(p => p.name !== currentUser);
        
        const myPts = me ? me.points || 0 : 0;
        const partnerPts = partner ? partner.points || 0 : 0;
        
        const myCrown = myPts > partnerPts && myPts > 0 ? ' 👑' : '';
        const partnerCrown = partnerPts > myPts && partnerPts > 0 ? ' 👑' : '';

        document.getElementById('myPoints').innerText = myPts + myCrown;
        document.getElementById('partnerPoints').innerText = partnerPts + partnerCrown;
      }
    }

    async function resetMyPoints() {
      if(!confirm(`Sadece kendi (${currentUser}) puanını sıfırlamak istediğine emin misin?`)) return;
      await db.from('profiles').update({ points: 0 }).eq('name', currentUser);
      loadProfiles();
    }

    // --- CEZA SİSTEMİ ---
    async function loadPenalties() {
      const { data } = await db.from('penalties').select('*').order('points', { ascending: true });
      const container = document.getElementById('penaltiesList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Sistemde ceza yok.</p>';
        return;
      }
      container.innerHTML = data.map(p => `
        <div class="flex items-center justify-between bg-white/90 p-2.5 rounded-xl border border-red-200 shadow-sm group">
          <div class="flex items-center gap-2">
            <button onclick="deletePenalty('${p.id}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors">🗑️</button>
            <span class="text-sm font-semibold text-slate-800">${p.title}</span>
          </div>
          <button onclick="applyPenalty(${p.points}, '${p.title.replace(/'/g, "\\'")}')" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95">Ceza Kes (-${p.points})</button>
        </div>
      `).join('');
    }

    async function addPenalty() {
      const titleInput = document.getElementById('newPenaltyTitle');
      const pointsInput = document.getElementById('newPenaltyPoints');
      if (!titleInput.value.trim() || !pointsInput.value) return;

      const { error } = await db.from('penalties').insert([{ title: titleInput.value.trim(), points: parseInt(pointsInput.value) }]);
      if (error) alert('Ceza eklenemedi: ' + error.message);
      else { titleInput.value = ''; pointsInput.value = ''; loadPenalties(); }
    }

    async function deletePenalty(id) {
      if(!confirm('Bu cezayı listeden silmek istediğinize emin misiniz?')) return;
      await db.from('penalties').delete().eq('id', id);
      loadPenalties();
    }

    async function applyPenalty(points, penaltyTitle) {
      if(!confirm(`Şu an seçili olan profile (${currentUser}) '${penaltyTitle}' cezası kesilecek ve ${points} puan silinecek. Emin misin?`)) return;

      const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
      if (profile) {
        const newPoints = (profile.points || 0) - points;
        await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
      }
      await db.from('task_history').insert([{ task_title: `🚨 CEZA YEDİ: ${penaltyTitle}`, points: -points, completed_by: currentUser }]);
      loadProfiles(); loadHistory();
    }

    // --- ÖDÜL SİSTEMİ ---
    async function loadRewards() {
      const { data } = await db.from('rewards').select('*').order('cost', { ascending: true });
      const container = document.getElementById('rewardsList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Markette şu an ödül yok.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="flex items-center justify-between bg-white/90 p-2.5 rounded-xl border border-yellow-200 shadow-sm group">
          <div class="flex items-center gap-2">
            <button onclick="deleteReward('${r.id}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors">🗑️</button>
            <span class="text-sm font-semibold text-slate-800">${r.title}</span>
          </div>
          <button onclick="buyReward(${r.cost}, '${r.title.replace(/'/g, "\\'")}')" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95">-${r.cost} Puan</button>
        </div>
      `).join('');
    }

    async function addReward() {
      const titleInput = document.getElementById('newRewardTitle');
      const costInput = document.getElementById('newRewardCost');
      if (!titleInput.value.trim() || !costInput.value) return;

      const { error } = await db.from('rewards').insert([{ title: titleInput.value.trim(), cost: parseInt(costInput.value) }]);
      if (error) alert('Ödül eklenemedi: ' + error.message);
      else { titleInput.value = ''; costInput.value = ''; loadRewards(); }
    }

    async function deleteReward(id) {
      if(!confirm('Bu ödülü marketten silmek istediğinize emin misiniz?')) return;
      await db.from('rewards').delete().eq('id', id);
      loadRewards();
    }

    async function buyReward(cost, rewardName) {
      const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
      if (!profile || (profile.points || 0) < cost) { alert('Puanın yetersiz! 🧹'); return; }

      if(!confirm(`'${rewardName}' ödülünü almak istediğine emin misin?`)) return;

      const newPoints = profile.points - cost;
      await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
      await db.from('task_history').insert([{ task_title: `🎁 ÖDÜL KULLANILDI: ${rewardName}`, points: -cost, completed_by: currentUser }]);
      
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
      loadProfiles(); loadHistory();
    }

    // --- GÖREV FONKSİYONLARI ---
    async function addTask() {
      const titleInput = document.getElementById('newTaskTitle');
      const pointsInput = document.getElementById('newTaskPoints');
      if (!titleInput.value.trim() || !pointsInput.value) return;

      const { error } = await db.from('tasks').insert([{ title: titleInput.value.trim(), points: parseInt(pointsInput.value) }]);
      if (error) alert('Görev eklenemedi: ' + error.message);
      else { titleInput.value = ''; pointsInput.value = ''; loadTasks(); }
    }

    async function deleteTask(id) {
      if(!confirm('Görevi silmek istediğinize emin misiniz?')) return;
      await db.from('tasks').delete().eq('id', id);
      loadTasks();
    }

    async function loadTasks() {
      const { data } = await db.from('tasks').select('*');
      const container = document.getElementById('tasksList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Görev bulunamadı.</p>';
        return;
      }
      container.innerHTML = data.map(t => `
        <div class="flex items-center justify-between p-3 bg-white/80 border border-indigo-100 rounded-xl shadow-sm group">
          <div class="flex items-center gap-2">
            <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors">🗑️</button>
            <div>
              <h3 class="font-bold text-slate-700 text-sm">${t.title}</h3>
              <span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md inline-block mt-0.5">+${t.points} Puan</span>
            </div>
          </div>
          <button onclick="completeTask('${t.id}', '${t.title.replace(/'/g, "\\'")}', ${t.points})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl active:scale-95 shadow-sm">Yaptım ➔</button>
        </div>
      `).join('');
    }

    async function completeTask(taskId, taskTitle, points) {
      const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
      if (profile) {
        const newPoints = (profile.points || 0) + points;
        await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
      }
      await db.from('task_history').insert([{ task_title: taskTitle, points: points, completed_by: currentUser }]);
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      loadProfiles(); loadHistory();
    }

    // --- GEÇMİŞ FONKSİYONLARI ---
    async function deleteHistory(id, points, completedBy) {
      if(!confirm('İşlemi iptal edip puanları geri almak istediğinize emin misiniz?')) return;
      const { data: profile } = await db.from('profiles').select('*').eq('name', completedBy).single();
      if (profile) {
        const newPoints = (profile.points || 0) - points;
        await db.from('profiles').update({ points: newPoints }).eq('name', completedBy);
      }
      await db.from('task_history').delete().eq('id', id);
      loadProfiles(); loadHistory();
    }

    async function loadHistory() {
      const { data } = await db.from('task_history').select('*').order('completed_at', { ascending: false }).limit(15);
      const container = document.getElementById('historyList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Henüz tamamlanan bir iş yok.</p>';
        return;
      }
      container.innerHTML = data.map(h => {
        const dateObj = new Date(h.completed_at);
        const dateStr = dateObj.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short' });
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        
        let pointClass = "text-emerald-600 bg-emerald-50";
        let pointSign = "+";
        if (h.points < 0) {
            pointSign = "";
            pointClass = h.task_title.includes('CEZA') ? "text-red-700 bg-red-100" : "text-yellow-700 bg-yellow-100";
        }
        return `
          <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm transition-colors hover:bg-slate-100">
            <div class="flex items-center gap-3">
              <button onclick="deleteHistory('${h.id}', ${h.points}, '${h.completed_by}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors">🗑️</button>
              <div>
                <span class="font-bold text-slate-700 block">${h.task_title}</span>
                <span class="text-[11px] font-semibold text-slate-400 block mt-0.5">${h.completed_by} • ${dateStr} ${timeStr}</span>
              </div>
            </div>
            <span class="text-xs font-black px-2.5 py-1 rounded-lg ${pointClass}">${pointSign}${h.points}</span>
          </div>
        `;
      }).join('');
    }

    // --- İSTEK FONKSİYONLARI ---
    async function addRequest() {
      const input = document.getElementById('requestInput');
      const pointsInput = document.getElementById('requestPoints');
      if (!input || !input.value.trim() || !pointsInput.value) return;

      const { error } = await db.from('requests').insert([{ title: input.value.trim(), points: parseInt(pointsInput.value), created_by: currentUser, status: 'pending' }]);
      if (error) alert('İstek gönderilemedi: ' + error.message);
      else { input.value = ''; pointsInput.value = ''; fetchRequests(); }
    }

    async function fetchRequests() {
      const { data } = await db.from('requests').select('*').eq('status', 'pending');
      const container = document.getElementById('requestsList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Bekleyen istek yok.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="flex items-center justify-between p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 text-sm shadow-sm">
          <div>
            <span class="font-bold text-slate-700">${r.title}</span>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[11px] font-bold text-indigo-600">🔔 ${r.created_by} senden bunu istiyor!</span>
              <span class="text-[10px] font-bold text-pink-600 bg-pink-50 border border-pink-100 px-1.5 py-0.5 rounded shadow-sm">Ödül: +${r.points || 0}</span>
            </div>
          </div>
          <button onclick="completeRequest('${r.id}', '${r.title.replace(/'/g, "\\'")}', ${r.points || 0}, '${r.created_at}')" class="text-xs bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl font-bold active:scale-95 shadow-sm">Tamamla</button>
        </div>
      `).join('');
    }

    async function completeRequest(id, title, points, createdAt) {
      await db.from('requests').update({ status: 'completed' }).eq('id', id);
      
      let delayText = "";
      if (createdAt && createdAt !== 'undefined') {
        const diffMs = new Date() - new Date(createdAt);
        const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
        const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        
        if (diffHrs > 0) delayText = ` (İstekten ${diffHrs}sa ${diffMins}dk sonra yapıldı)`;
        else if (diffMins > 0) delayText = ` (İstekten ${diffMins}dk sonra yapıldı)`;
        else delayText = ` (Anında yapıldı!)`;
      }

      if (points > 0) {
        const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
        if (profile) {
          const newPoints = (profile.points || 0) + points;
          await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
        }
      }
      await db.from('task_history').insert([{ task_title: `Özel İstek: ${title}${delayText}`, points: points, completed_by: currentUser }]);
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      loadProfiles(); loadHistory(); fetchRequests();
    }

    // Başlat
    loadProfiles(); loadPenalties(); loadRewards(); fetchRequests(); loadTasks(); loadHistory();
    document.querySelector('.nav-btn').classList.add('active', 'text-indigo-600');
  </script>
</body>
</html>
