<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ev Görevleri & İkramlar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto min-h-screen border-x border-slate-200 bg-white shadow-xl">

  <!-- Üst Başlık & Profil Seçimi -->
  <div class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold tracking-tight">🏡 Ev Görevleri</h1>
      <select id="userSelect" onchange="switchUser()" class="bg-indigo-700 text-white text-sm font-semibold rounded-lg px-3 py-1.5 outline-none border border-indigo-500">
        <option value="Ben">Ben 👤</option>
        <option value="O">O 👤</option>
      </select>
    </div>
    
    <!-- Puan Durumu -->
    <div class="grid grid-cols-2 gap-3 bg-indigo-700/60 p-3 rounded-2xl border border-indigo-400/30">
      <div class="text-center p-2 bg-white/10 rounded-xl">
        <span class="text-xs text-indigo-200 block">Benim Puanım</span>
        <span id="myPoints" class="text-2xl font-black text-amber-300">0</span>
      </div>
      <div class="text-center p-2 bg-white/10 rounded-xl">
        <span class="text-xs text-indigo-200 block">Onun Puanı</span>
        <span id="partnerPoints" class="text-2xl font-black text-amber-300">0</span>
      </div>
    </div>
  </div>

  <!-- Ana İçerik -->
  <div class="p-5 space-y-6">

    <!-- İstek Oluşturma Alanı -->
    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 shadow-sm">
      <h2 class="text-sm font-bold text-amber-900 mb-2 flex items-center gap-1.5">
        <span>✨</span> İstek / Bilet Oluştur
      </h2>
      <div class="flex gap-2">
        <input type="text" id="requestInput" placeholder="Örn: Bana bir kahve yap ☕" class="flex-1 text-sm rounded-xl border border-amber-300 px-3 py-2 outline-none focus:ring-2 focus:ring-amber-500">
        <button onclick="addRequest()" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold text-sm px-4 py-2 rounded-xl transition">Gönder</button>
      </div>
    </div>

    <!-- Aktif İstekler -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Gelen İstekler</h2>
      <div id="requestsList" class="space-y-2">
        <p class="text-xs text-slate-400 italic">Henüz bir istek yok...</p>
      </div>
    </div>

    <!-- Görev Listesi -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Günlük Ev Görevleri</h2>
      <div id="tasksList" class="space-y-3">
        <p class="text-xs text-slate-400 italic">Görevler yükleniyor...</p>
      </div>
    </div>

  </div>

  <!-- JS Kodları ve Supabase Entegrasyonu -->
  <script>
    // Supabase Bağlantısı (Buraya kendi bilgilerinizi yapıştıracaksınız)
    const SUPABASE_URL = 'https://wbbztdstalznijwutydz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KoiM7IPTmTf7-kDucRq-GA_VFE-no9T';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = 'Ben';

    async function init() {
      await loadProfiles();
      await loadTasks();
      await loadRequests();
    }

    function switchUser() {
      currentUser = document.getElementById('userSelect').value;
      init();
    }

    async function loadProfiles() {
      const { data } = await supabase.from('profiles').select('*');
      if (data) {
        const me = data.find(p => p.name === currentUser);
        const partner = data.find(p => p.name !== currentUser);
        if (me) document.getElementById('myPoints').innerText = me.points;
        if (partner) document.getElementById('partnerPoints').innerText = partner.points;
      }
    }
async function addRequest() {
      const input = document.getElementById('requestInput');
      if (!input || !input.value.trim()) return;

      const text = input.value.trim();
      const { data, error } = await supabase
        .from('requests')
        .insert([{ title: text, created_by: currentUser, status: 'pending' }]);

      if (error) {
        console.error('Hata:', error);
        alert('İstek gönderilemedi: ' + error.message);
      } else {
        input.value = '';
        if (typeof fetchRequests === 'function') fetchRequests();
      }
    }

    async function loadTasks() {
      // Var olan kodların buradan devam edecek...
    async function loadTasks() {
      const { data } = await supabase.from('tasks').select('*').order('created_at', { ascending: true });
      const container = document.getElementById('tasksList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Görev bulunamadı.</p>';
        return;
      }
      container.innerHTML = data.map(t => `
        <div class="flex items-center justify-between p-3.5 bg-white border border-slate-100 shadow-sm rounded-2xl">
          <div>
            <h3 class="font-semibold text-slate-800 text-sm">${t.title}</h3>
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md inline-block mt-1">+${t.points} Puan</span>
          </div>
          <button onclick="completeTask('${t.id}', ${t.points})" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
            Tamamladım ➔
          </button>
        </div>
      `).join('');
    }

    async function completeTask(taskId, points) {
      // Puan ekle
      const { data: prof } = await supabase.from('profiles').select('points').eq('name', currentUser).single();
      if (prof) {
        await supabase.from('profiles').update({ points: prof.points + points }).eq('name', currentUser);
      }
      alert(`Tebrikler! +${points} Puan Kazandın 🎉`);
      init();
    }

    async function addRequest() {
      const input = document.getElementById('requestInput');
      if (!input.value.trim()) return;
      await supabase.from('requests').insert([{ title: input.value, from_user: currentUser }]);
      input.value = '';
      loadRequests();
    }

    async function loadRequests() {
      const { data } = await supabase.from('requests').select('*').eq('status', 'bekliyor').order('created_at', { ascending: false });
      const container = document.getElementById('requestsList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 italic">Bekleyen istek bulunmuyor.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="flex items-center justify-between p-3 bg-amber-50/50 border border-amber-200/60 rounded-xl text-xs">
          <div>
            <span class="font-bold text-amber-900">${r.from_user}:</span>
            <span class="text-slate-700 ml-1">${r.title}</span>
          </div>
          <button onclick="resolveRequest('${r.id}')" class="bg-amber-600 text-white font-semibold px-2.5 py-1 rounded-lg">Kabul Et</button>
        </div>
      `).join('');
    }

    async function resolveRequest(id) {
      await supabase.from('requests').update({ status: 'tamamlandi' }).eq('id', id);
      loadRequests();
    }

    init();
  </script>
</body>
</html>
