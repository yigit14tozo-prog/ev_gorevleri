<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ev Görevleri & Puan Tablosu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- Üst Başlık & Kullanıcı Seçimi -->
  <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight">🏠 Ev Görevleri</h1>
      <select id="userSelect" onchange="changeUser(this.value)" class="bg-indigo-700 text-white font-medium text-sm py-1.5 px-3 rounded-lg border border-indigo-500 focus:outline-none">
        <option value="Yiğit">Profil: Yiğit</option>
        <option value="Buse">Profil: Buse</option>
      </select>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-6">

    <!-- Puan Durumu Kartı -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Benim Puanım</span>
        <div id="myPoints" class="text-3xl font-extrabold text-indigo-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Partner Puanı</span>
        <div id="partnerPoints" class="text-3xl font-extrabold text-pink-500 mt-1">0</div>
      </div>
    </div>

    <!-- İstek / Bilet Oluştur -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">💡 Yeni İstek Gönder</h2>
      <div class="flex gap-2">
        <input type="text" id="requestInput" placeholder="Örn: Kahve yap, Bulaşığa yardım et..." class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addRequest()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Gönder</button>
      </div>
    </div>

    <!-- Gelen İstekler Listesi -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">📩 Gelen İstekler</h2>
      <div id="requestsList" class="space-y-2">
        <p class="text-xs text-slate-400">Yükleniyor...</p>
      </div>
    </div>

    <!-- YENİ GÖREV EKLEME ALANI -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 bg-indigo-50">
      <h2 class="text-sm font-bold text-indigo-800 mb-2 uppercase tracking-wide">➕ Listeye Yeni Görev Ekle</h2>
      <div class="flex gap-2">
        <input type="text" id="newTaskTitle" placeholder="Görev Adı (Örn: Çöpü At)" class="flex-1 border border-indigo-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="number" id="newTaskPoints" placeholder="Puan" class="w-20 border border-indigo-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addTask()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Ekle</button>
      </div>
    </div>

    <!-- Görev Listesi -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">✅ Yapılacak Görevler</h2>
      <div id="tasksList" class="space-y-3">
        <p class="text-xs text-slate-400">Görevler yükleniyor...</p>
      </div>
    </div>

    <!-- GEÇMİŞ VE TARİHLER -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">⏱️ Son Yapılan İşler</h2>
      <div id="historyList" class="space-y-2">
        <p class="text-xs text-slate-400">Yükleniyor...</p>
      </div>
    </div>

  </div>

  <!-- JavaScript Kodları ve Supabase -->
  <script>
    const SUPABASE_URL = 'https://wbbztdstalznijwutydz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KoiM7IPTmTf7-kDucRq-GA_VFE-no9T';
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Varsayılan kullanıcıyı Yiğit yaptık
    let currentUser = 'Yiğit';

    function changeUser(user) {
      currentUser = user;
      loadProfiles();
      fetchRequests();
    }

    async function loadProfiles() {
      const { data } = await db.from('profiles').select('*');
      if (data) {
        const me = data.find(p => p.name === currentUser);
        const partner = data.find(p => p.name !== currentUser);
        if (me) document.getElementById('myPoints').innerText = me.points || 0;
        if (partner) document.getElementById('partnerPoints').innerText = partner.points || 0;
      }
    }

    async function addTask() {
      const titleInput = document.getElementById('newTaskTitle');
      const pointsInput = document.getElementById('newTaskPoints');
      if (!titleInput.value.trim() || !pointsInput.value) return;

      const title = titleInput.value.trim();
      const points = parseInt(pointsInput.value);

      const { error } = await db.from('tasks').insert([{ title, points }]);
      if (error) {
        alert('Görev eklenemedi: ' + error.message);
      } else {
        titleInput.value = '';
        pointsInput.value = '';
        loadTasks();
      }
    }

    async function deleteTask(id) {
      if(!confirm('Bu görevi listeden silmek istediğinize emin misiniz?')) return;
      await db.from('tasks').delete().eq('id', id);
      loadTasks();
    }

    async function loadTasks() {
      const { data } = await db.from('tasks').select('*');
      const container = document.getElementById('tasksList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Görev bulunamadı.</p>';
        return;
      }
      container.innerHTML = data.map(t => `
        <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-lg group">
          <div class="flex items-center gap-2">
            <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500 text-lg transition-colors" title="Görevi Sil">🗑️</button>
            <div>
              <h3 class="font-semibold text-slate-800 text-sm">${t.title}</h3>
              <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md inline-block mt-1">+${t.points} Puan</span>
            </div>
          </div>
          <button onclick="completeTask('${t.id}', '${t.title.replace(/'/g, "\\'")}', ${t.points})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-xs px-3 py-1.5 rounded-lg transition-colors">Tamamladım ➔</button>
        </div>
      `).join('');
    }

    async function completeTask(taskId, taskTitle, points) {
      const { data: profile } = await db.from('profiles').select('*').eq('name', currentUser).single();
      if (profile) {
        const newPoints = (profile.points || 0) + points;
        await db.from('profiles').update({ points: newPoints }).eq('name', currentUser);
        loadProfiles();
      }
      
      await db.from('task_history').insert([{
        task_title: taskTitle,
        points: points,
        completed_by: currentUser
      }]);
      loadHistory();
    }

    async function loadHistory() {
      const { data } = await db.from('task_history').select('*').order('completed_at', { ascending: false }).limit(10);
      const container = document.getElementById('historyList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Henüz tamamlanan bir iş yok.</p>';
        return;
      }
      
      container.innerHTML = data.map(h => {
        const dateObj = new Date(h.completed_at);
        const dateStr = dateObj.toLocaleDateString('tr-TR');
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        
        return `
          <div class="flex items-center justify-between p-2.5 bg-white border border-slate-100 rounded-lg text-sm shadow-sm">
            <div>
              <span class="font-semibold text-slate-700 block">${h.task_title}</span>
              <span class="text-[11px] text-slate-400 block mt-0.5">${h.completed_by} yaptı • ${dateStr} ${timeStr}</span>
            </div>
            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">+${h.points}</span>
          </div>
        `;
      }).join('');
    }

    async function addRequest() {
      const input = document.getElementById('requestInput');
      if (!input || !input.value.trim()) return;

      const text = input.value.trim();
      const { error } = await db
        .from('requests')
        .insert([{ title: text, created_by: currentUser, status: 'pending' }]);

      if (error) {
        alert('İstek gönderilemedi: ' + error.message);
      } else {
        input.value = '';
        fetchRequests();
      }
    }

    async function fetchRequests() {
      const { data } = await db.from('requests').select('*').eq('status', 'pending');
      const container = document.getElementById('requestsList');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Aktif istek bulunmuyor.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border border-slate-100 text-sm">
          <div>
            <span class="font-medium text-slate-800">${r.title}</span>
            <span class="text-xs text-slate-400 block">Gönderen: ${r.created_by}</span>
          </div>
          <button onclick="completeRequest('${r.id}')" class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-md font-semibold hover:bg-emerald-200">Tamamla</button>
        </div>
      `).join('');
    }

    async function completeRequest(id) {
      await db.from('requests').update({ status: 'completed' }).eq('id', id);
      fetchRequests();
    }

    loadProfiles();
    fetchRequests();
    loadTasks();
    loadHistory();
  </script>
</body>
</html>
